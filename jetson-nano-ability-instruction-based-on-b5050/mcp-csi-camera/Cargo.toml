[package]
name = "mcp-csi-camera"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing the Jetson Nano CSI camera as a capture_frame tool"
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "1.6", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
base64 = "0.22"
# Pinned to the 0.20.x series — last release line that still compiles against
# the GStreamer 1.14.5 that ships with JetPack 4.6 (R32.7.6). Newer crates
# (0.22+) require gst >= 1.18.
gstreamer = "0.20"
gstreamer-app = "0.20"
